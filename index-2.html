 gryffindor:{n:"Gryffindor",c:"Escarlata y dorado",s:"León",hc:"#e0b34a",h1:"#4a0d12",h2:"#1a0709",v:["Valentía","Coraje","Determinación","Lealtad"],d:"Gryffindor es el hogar de los valientes y determinados. Sus integrantes aprenden que la verdadera valentía no consiste en no tener miedo, sino en enfrentarlo. Aquí, el coraje y la amistad son tan importantes como la magia.",w:"Bienvenidos a la sala común de Gryffindor, el hogar de los valientes y determinados. Entre tonos escarlata y dorados, junto al calor de la chimenea, encontrarán un lugar donde la lealtad, el coraje y la amistad son tan importantes como la magia. Aquí aprenderán que la verdadera valentía no consiste en no tener miedo, sino en enfrentarlo. Y recuerden: incluso el corazón más valiente necesita un dragón en quien confiar.",e:"Chimenea encendida, sillones cálidos, retratos, piedra antigua y estandartes."},

P.dragones=()=>page("Jinetes y dragones","El vínculo entre jinetes y dragones ancestrales.",`<div style="margin:0 0 20px;border:1px solid #c9a24b55;overflow:hidden;position:relative;height:220px;background:#f4ece0">${scene()}</div><h2>El vínculo</h2><p>Los dragones no son simples animales de entrenamiento ni criaturas destinadas a obedecer órdenes. Son seres inteligentes, orgullosos y con voluntad propia.</p><p>El vínculo entre jinete y dragón no se obtiene mediante la fuerza, sino a través de la confianza mutua.</p><h2>Las cinco etapas del vínculo</h2><div class="parch">${STAGES.map(s=>`<h3>${s[0]}</h3><p>${s[1]}</p>`).join("")}</div><h2 style="margin-top:30px">Los cinco principios del jinete</h2><div class="grid">${PRIN.map(p=>`<div class="card"><div class="b" style="text-align:center"><div class="serif" style="font-size:2.6rem;color:var(--gold)" aria-hidden="true">${p[0]}</div><h3>${p[1].toUpperCase()}</h3><p>${p[2]}</p></div></div>`).join("")}</div><h2 style="margin-top:30px">Un vínculo saludable</h2><p>Se construye respetando los límites, superando desafíos en equipo, reparando los errores y celebrando cada avance sin compararse con otros jinetes.</p><h2>Directorio de dragones</h2>${ea("dragones")}${DATA.dragones.length?`<div class="grid">${DATA.dragones.map((d,i)=>`<div class="card"><div class="b">${eb("dragones",i)}<h3>${esc(d.nombre)}</h3><span class="tag">${esc(d.especie)} · ${esc(d.elemento)}</span><p>${esc(d.descripcion)}</p><small>Jinete: ${esc(d.jinete)}</small></div></div>`).join("")}</div>`:pend("Directorio pendiente de publicación (DATA.dragones).")}`);

P.carta=()=>page("Carta de Hogwarts","",`<div style="background:#efe6d6;padding:24px 8px;border-radius:2px"><p style="text-align:center"><button class="btn" id="sk">Omitir animación</button></p><div class="parch letter" id="lt"><p class="serif" style="text-align:center;color:#6b4a12;letter-spacing:.12em;font-size:1.15rem">ARMY OF MAGIC: HOGWARTS AND DRAGONS</p><p><b>Querido nuevo integrante:</b></p><p>Nos complace darte la bienvenida a Army of Magic: Hogwarts and Dragons, un lugar donde la magia, la imaginación y las historias se unen para crear aventuras que todavía están por escribirse.</p><p>Tras las antiguas puertas de Hogwarts te esperan cuatro casas, cada una con sus propios valores, secretos y tradiciones. Aquí podrás aprender hechizos, descubrir misterios, participar en actividades mágicas y construir tu propia historia junto a otros estudiantes.</p><p>Pero hay algo más que te espera fuera de las aulas.</p><p>Los dragones ancestrales están despertando y los secretos de los antiguos jinetes comienzan a salir a la luz. Quizá tu camino te lleve a descubrir una criatura con la que compartir un vínculo extraordinario. Quizá debas superar pruebas que pondrán a prueba tu valentía, tu ingenio, tu sabiduría o tu lealtad. Sea cual sea tu destino, recuerda que la magia más poderosa no siempre es la que produce los hechizos más impresionantes, sino aquella que nace de la confianza y el respeto.</p><p>En esta comunidad, tu imaginación tiene un lugar, tus decisiones pueden cambiar el rumbo de una historia y cada personaje puede dejar una huella en el mundo que construimos juntos. No necesitas conocerlo todo desde el principio; basta con llegar con ganas de participar, crear y compartir.</p><p>Prepárate para cruzar las puertas del castillo, encontrar tu lugar entre las cuatro casas y descubrir los secretos que aguardan más allá de sus muros.</p><p><b>Tu historia comienza ahora.</b></p><p>Con nuestros mejores deseos mágicos,<br><i>La administración de Army of Magic: Hogwarts and Dragons</i></p><div class="seal" aria-hidden="true">A</div><blockquote style="border-color:#8a6d2f">«La magia te abre la puerta; tus decisiones escribirán lo que encuentres al otro lado».</blockquote></div></div><div style="text-align:center;margin-top:26px"><h2>Acceso a la comunidad</h2>${ED?`<p><input id="wa" style="width:min(520px,100%)" value="${esc(DATA.whatsapp)}" aria-label="Enlace de WhatsApp"></p>`:""}<a class="btn f" target="_blank" rel="noopener" href="${esc(DATA.whatsapp)}">Unirme a Army of Magic</a> <a class="btn" href="#/inicio">Volver al inicio</a></div>`);

 const ps=Array.from({length:50},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.4,v:Math.random()*.4+.1,a:Math.random()}));
 (function f(){x.clearRect(0,0,w,h);ps.forEach(p=>{p.y-=p.v;p.a+=.02;if(p.y<0){p.y=h;p.x=Math.random()*w}x.fillStyle=`rgba(140,111,86,${.3+.4*Math.abs(Math.sin(p.a))})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});raf=requestAnimationFrame(f)})()}
